name: CI

# Every push to any branch, and every pull request. Code never reaches staging
# or production without passing this first. Section 6.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI cannot read the deployment platform's environment values, which is why the
# adapter guard runs in the process serving the request rather than here (D-16).
# What CI can do is pin itself to fake data and a fixture vision provider, so no
# job reaches a real backend and no test spends money (D-25).
env:
  DATA_ADAPTER: mock
  VISION_PROVIDER: fixture

# Job names are the status-check names. These seven are the set branch
# protection requires on main and staging.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # next typegen first: Next 16 generates LayoutProps/PageProps into
      # .next/types, so a bare tsc --noEmit fails on a clean clone. D-27.
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  data-seam:
    name: data-seam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Fails if any file outside src/data/supabase/ or src/lib/ imports
      # @supabase/*. This is what keeps Section 3.2 true over 32 weeks instead
      # of only on day one. D-16.
      - run: pnpm check:data-seam
